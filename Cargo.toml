[workspace]
resolver = "2"
members = [
    "crates/yuris-core",
    "crates/yuris-format",
    "crates/yuris-value",
    "crates/yuris-script",
    "crates/yuris-vm",
    "crates/yuris-host",
    "crates/yuris-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["YurisKernel contributors"]
license = "GPL-3.0-or-later"
repository = ""

[workspace.dependencies]
# --- internals ---
yuris-core     = { path = "crates/yuris-core" }
yuris-format   = { path = "crates/yuris-format" }
yuris-value    = { path = "crates/yuris-value" }
yuris-script   = { path = "crates/yuris-script" }
yuris-vm       = { path = "crates/yuris-vm" }
yuris-host     = { path = "crates/yuris-host" }

# --- externals ---
thiserror          = "2"
encoding_rs        = "0.8"
tracing            = "0.1"
tracing-subscriber = "0.3"
anyhow             = "1"
byteorder          = "1"
flate2             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
bincode            = "1"
smallvec           = "1"
lru                = "0.12"
clap               = { version = "4", features = ["derive"] }
png                = "0.18"
ab_glyph           = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
